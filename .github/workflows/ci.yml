name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30's undici needs util.markAsUncloneable (Node >= 22.9);
          # Node 20 is also past end-of-life.
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck:templates
      - run: npm run build

      # Regression guard for the symlinked-bin entry-point bug (fixed in
      # 5e2d2a2): npm/npx/yarn/pnpm always invoke a package's `bin` entry
      # through a symlink, which the unit tests alone don't exercise. Build a
      # symlink to the real dist/cli.js and confirm it actually runs through it.
      - name: smoke test packaged bin via symlink
        run: |
          ln -s "$PWD/dist/cli.js" /tmp/react-thaizip
          test "$(node /tmp/react-thaizip --version)" = "$(node -p 'require("./package.json").version')"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/docs/package-lock.json

      # apps/docs imports templates/react/ts/**/* directly; Node resolves
      # their bare imports (thaizip, clsx, tailwind-merge, @base-ui/react) by
      # walking up from templates/ to this repo's own node_modules, so it
      # has to be installed too, not just apps/docs/node_modules.
      - run: npm ci
      - run: npm ci
        working-directory: apps/docs
      - run: npm run build
        working-directory: apps/docs
