name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30's undici needs util.markAsUncloneable (Node >= 22.9);
          # Node 20 is also past end-of-life.
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck:templates
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/docs/package-lock.json

      # apps/docs imports templates/react/ts/**/* directly; Node resolves
      # their bare imports (thaizip, clsx, tailwind-merge, @base-ui/react) by
      # walking up from templates/ to this repo's own node_modules, so it
      # has to be installed too, not just apps/docs/node_modules.
      - run: npm ci
      - run: npm ci
        working-directory: apps/docs
      - run: npm run build
        working-directory: apps/docs
