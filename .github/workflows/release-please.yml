name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm >= 11.5.1 is required for trusted publishing (OIDC).
      - run: npm install --global npm@11.17.0
      # --ignore-scripts: this job can mint an OIDC token that publishes the
      # package, so no dependency lifecycle script may run inside it.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      # Trusted publishing: npm exchanges this workflow's OIDC token for a
      # short-lived publish credential, so no long-lived NPM_TOKEN exists to
      # leak. Requires a Trusted Publisher for this repo + workflow on
      # npmjs.com. Provenance is attached automatically.
      - run: npm publish --provenance
